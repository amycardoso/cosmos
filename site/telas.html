<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08080C">
<title>Telas · Cosmos</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="img/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#telas">Pular para as telas</a>

<header class="top">
  <a class="brand" href="index.html" aria-label="Cosmos de Amélia, início"><img src="img/jupiter.jpg" alt="" width="40" height="40">Amélia</a>
  <nav class="sections" aria-label="Páginas">
    <a href="index.html">Início</a>
    <a href="leitura.html"><i class="sw sw--read" aria-hidden="true"></i>Leitura</a>
    <a href="musica.html"><i class="sw sw--music" aria-hidden="true"></i>Música</a>
    <a href="telas.html" aria-current="page"><i class="sw sw--screen" aria-hidden="true"></i>Telas</a>
  </nav>
  <div class="period" role="radiogroup" aria-label="Período">
    <button role="radio" data-period="week">semana</button>
    <button role="radio" data-period="month">mês</button>
    <button role="radio" data-period="year">ano</button>
  </div>
</header>

<main>
  <section class="stream stream--screen" id="telas" aria-labelledby="h-screen">
    <header class="stream__head"><h1 id="h-screen">Telas</h1><p data-screen-line></p></header>
    <div class="stream__grid">
      <figure class="fig fig--wide">
        <figcaption><h3>Séries em andamento</h3><p>Um traço por episódio da temporada; os acesos já vi.</p></figcaption>
        <ul class="shows" data-shows></ul>
      </figure>
      <div class="fig-stack">
        <figure class="fig">
          <figcaption><h3>Como me senti</h3><p>O que marquei depois de cada episódio e filme no período.</p></figcaption>
          <ul class="feel" data-feelings></ul>
        </figure>
        <figure class="fig">
          <figcaption><h3>Filmes do ano e a fila</h3></figcaption>
          <ul class="films" data-films></ul>
          <ul class="queue" data-queue></ul>
        </figure>
      </div>
      <figure class="fig fig--full mara">
        <figcaption><h3>Maratonas</h3><p data-mara-line></p></figcaption>
        <div class="mara__chart">
          <div class="mara__notes" data-mara-notes aria-hidden="true"></div>
          <div class="mara__bars" data-mara></div>
          <div class="mara__months" data-mara-months aria-hidden="true"></div>
        </div>
        <p class="mara__readout" data-mara-readout aria-live="polite"></p>
        <ol class="mara__list" data-mara-list aria-label="As maiores maratonas do ano"></ol>
      </figure>
      <figure class="fig fig--full">
        <figcaption><h3>Ritmo de cada série</h3><p>Do primeiro ao último episódio no ano, um traço por dia em que assisti. Quanto mais alto o traço, mais episódios naquele dia.</p></figcaption>
        <ul class="pace" data-pace></ul>
      </figure>
    </div>
  </section>
</main>

<footer class="foot">
  <p data-updated></p>
  <p data-sources></p>
  <p class="credits">Júpiter em ultravioleta, telescópio espacial Hubble: NASA, ESA.</p>
</footer>

<script src="year.js"></script>
<script src="app.js"></script>
</body>
</html>
