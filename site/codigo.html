<body>
<a class="skip" href="#codigo">Pular para o código</a>

<header class="top">
  <a class="brand" href="index.html" aria-label="Cosmos de Amélia, início"><img src="img/jupiter.jpg" alt="" width="40" height="40">Amélia</a>
  <nav class="sections" aria-label="Páginas">
    <a href="index.html">Início</a>
    <a href="leitura.html"><i class="sw sw--read" aria-hidden="true"></i>Leitura</a>
    <a href="musica.html"><i class="sw sw--music" aria-hidden="true"></i>Música</a>
    <a href="telas.html"><i class="sw sw--screen" aria-hidden="true"></i>Telas</a>
    <a href="codigo.html" aria-current="page"><i class="sw sw--code" aria-hidden="true"></i>Código</a>
  </nav>
  <div class="period" role="radiogroup" aria-label="Período">
    <button role="radio" data-period="week">semana</button>
    <button role="radio" data-period="month">mês</button>
    <button role="radio" data-period="year">ano</button>
  </div>
</header>

<main>
  <section class="stream stream--code" id="codigo" aria-labelledby="h-code">
    <header class="stream__head"><h1 id="h-code">Código</h1><p data-code-line></p></header>
    <div class="stream__grid">
      <figure class="fig fig--full bands bands--one">
        <figcaption class="vh">Os dias em que mexi nos meus projetos</figcaption>
        <div class="bands__months" data-months aria-hidden="true"></div>
        <div class="band" data-band="code"></div>
        <p class="bands__readout" data-readout aria-live="polite"></p>
      </figure>
      <figure class="fig fig--full">
        <figcaption><h3>Em que eu mexi</h3><p>Cada projeto meu numa linha, semana a semana. Mais claro onde voltei mais dias naquela semana. Só os repositórios que são meus: nada do trabalho, e nenhuma contagem de commits.</p></figcaption>
        <ul class="proj" data-projects></ul>
      </figure>
      <figure class="fig fig--wide">
        <figcaption><h3>Quando eu crio</h3><p>Cada hora da semana em que mexi em algum projeto, medida contra a minha própria história.</p></figcaption>
        <div class="code-hours" data-code-hours></div>
        <p class="day__readout" data-code-readout aria-live="polite"></p>
        <ul class="peaks"><li><i class="sw sw--code" aria-hidden="true"></i><span data-code-peak></span></li></ul>
      </figure>
      <figure class="fig fig--narrow">
        <figcaption><h3>Em que línguas</h3><p>A língua de cada projeto, pesada pelos dias em que mexi nele.</p></figcaption>
        <div class="langs__bar" data-lang-bar></div>
        <ol class="langs" data-langs></ol>
      </figure>
    </div>
  </section>
</main>

<footer class="foot">
  <p data-updated></p>
  <p data-sources></p>
  <p class="credits">Júpiter em ultravioleta, telescópio espacial Hubble: NASA, ESA.</p>
</footer>
